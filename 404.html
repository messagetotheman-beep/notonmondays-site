<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Not On Mondays</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="The page you were looking for doesn't exist. It might have moved, or the link might not be quite right.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>

/* ─── RESET ─── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }

/* ─── PAGE ─── */
body {
  background: #111124;
  color: #f2f0e8;
  font-family: 'DM Mono', monospace;
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}

/* ─── BACKGROUND ─── */
.bg-light {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse 800px 600px at 65% 55%, rgba(26,42,212,0.055) 0%, transparent 70%),
    radial-gradient(ellipse 400px 300px at 0% 100%, rgba(26,42,212,0.04) 0%, transparent 60%);
}

.bg-grid {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    linear-gradient(rgba(242,240,232,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(242,240,232,0.018) 1px, transparent 1px);
  background-size: 72px 72px;
}

/* ─── ACCENT BAR ─── */
.accent-bar {
  position: fixed;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: #1a2ad4;
  z-index: 10;
}

/* ─── RULE LINES ─── */
.rule-top,
.rule-bottom {
  position: fixed;
  left: 0; right: 0;
  height: 1px;
  z-index: 10;
  pointer-events: none;
}
.rule-top {
  top: 48px;
  background: linear-gradient(90deg, #1a2ad4 0%, rgba(26,42,212,0.25) 30%, transparent 80%);
}
.rule-bottom {
  bottom: 48px;
  background: linear-gradient(90deg, #1a2ad4 0%, rgba(26,42,212,0.25) 30%, transparent 80%);
}

/* ─── MAIN LAYOUT ─── */
.page {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  align-items: center;
  padding: 80px 64px 80px 72px;
  min-height: 100vh;
}

.content {
  max-width: 480px;
  width: 100%;
}

/* ─── NOM MARK ─── */
.nom-mark {
  display: flex;
  flex-direction: column;
  line-height: 1.05;
  margin-bottom: 36px;
}
.nom-mark span {
  font-family: 'DM Mono', monospace;
  font-weight: 300;
  font-size: 28px;
  letter-spacing: -0.02em;
  display: block;
}
.nom-mark .nm-n { color: rgba(242,240,232,0.14); }
.nom-mark .nm-o { color: rgba(242,240,232,0.14); }
.nom-mark .nm-m { color: #1a2ad4; }

/* ─── EYEBROW ─── */
.eyebrow {
  font-family: 'DM Mono', monospace;
  font-weight: 400;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(26,42,212,0.75);
  margin-bottom: 18px;
}

/* ─── HEADLINE ─── */
.headline {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 300;
  font-size: clamp(34px, 4vw, 48px);
  line-height: 1.1;
  color: #f2f0e8;
  margin-bottom: 20px;
  letter-spacing: -0.01em;
}

/* ─── BODY ─── */
.body-copy {
  font-family: 'DM Mono', monospace;
  font-weight: 300;
  font-size: 13px;
  line-height: 1.75;
  color: rgba(242,240,232,0.6);
  letter-spacing: 0.03em;
  margin-bottom: 40px;
}

/* ─── PONG TERMINAL ─── */
.terminal-wrap {
  margin-bottom: 44px;
}

.terminal-chrome {
  display: inline-block;
  border: 1px solid rgba(26,42,212,0.28);
  background: rgba(10,10,22,0.65);
  padding: 0;
  position: relative;
}

.terminal-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  border-bottom: 1px solid rgba(26,42,212,0.18);
}

.terminal-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(242,240,232,0.08);
  border: 1px solid rgba(242,240,232,0.12);
}

.terminal-title {
  font-family: 'DM Mono', monospace;
  font-weight: 300;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(242,240,232,0.2);
  margin-left: auto;
}

/* Subtle scanline overlay */
.terminal-chrome::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.06) 2px,
    rgba(0,0,0,0.06) 4px
  );
  pointer-events: none;
  z-index: 1;
}

canvas#pong {
  display: block;
}

/* ─── CTA ─── */
.cta-wrap {
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: flex-start;
}

.cta-btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 13px 26px;
  background: #1a2ad4;
  color: #f2f0e8;
  text-decoration: none;
  font-family: 'DM Mono', monospace;
  font-weight: 400;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  border: 1px solid #1a2ad4;
  transition: background 0.2s, border-color 0.2s;
}

.cta-btn::after {
  content: '';
  display: inline-block;
  width: 14px;
  height: 1px;
  background: currentColor;
  transition: transform 0.18s ease;
}

.cta-btn:hover {
  background: #141e9e;
  border-color: #141e9e;
}
.cta-btn:hover::after {
  transform: translateX(3px);
}

.secondary-links {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 20px;
  list-style: none;
}

.secondary-links a {
  font-family: 'DM Mono', monospace;
  font-weight: 300;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(242,240,232,0.38);
  text-decoration: none;
  transition: color 0.2s;
  padding: 4px 0;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
}

.secondary-links a:hover {
  color: rgba(242,240,232,0.65);
}

/* ─── FOOTER ─── */
.page-footer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 72px 16px;
  pointer-events: none;
}

.footer-url {
  font-family: 'DM Mono', monospace;
  font-weight: 300;
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(26,42,212,0.5);
}

.footer-corner {
  font-family: 'DM Mono', monospace;
  font-weight: 300;
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(242,240,232,0.12);
}

/* ─── REDUCED MOTION ─── */
@media (prefers-reduced-motion: reduce) {
  .cta-btn,
  .cta-btn::after,
  .secondary-links a { transition: none; }
}

/* ─── RESPONSIVE ─── */
@media (max-width: 900px) {
  .page {
    padding: 80px 40px 80px 52px;
  }
  .page-footer {
    padding: 0 52px 16px;
  }
}

@media (max-width: 640px) {
  .page {
    padding: 72px 28px 80px 36px;
    align-items: flex-start;
    padding-top: 96px;
  }
  .headline {
    font-size: 34px;
  }
  .nom-mark span {
    font-size: 22px;
  }
  .page-footer {
    padding: 0 36px 14px;
  }
  .footer-corner {
    display: none;
  }
}

@media (max-width: 375px) {
  .page {
    padding: 80px 20px 80px 28px;
  }
}

</style>
</head>
<body>

<a href="#main-content" class="skip-link" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">Skip to main content</a>

<div class="bg-light" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>
<div class="accent-bar" aria-hidden="true"></div>
<div class="rule-top" aria-hidden="true"></div>
<div class="rule-bottom" aria-hidden="true"></div>

<main class="page" id="main-content">
  <div class="content">

    <div class="nom-mark" aria-label="Not On Mondays">
      <span class="nm-n" aria-hidden="true">n</span>
      <span class="nm-o" aria-hidden="true">o</span>
      <span class="nm-m" aria-hidden="true">m</span>

    <!-- Pong terminal -->
    <div class="terminal-wrap" aria-hidden="true">
      <div class="terminal-chrome">
        <div class="terminal-bar">
          <span class="terminal-dot"></span>

</footer>

<script>
(function () {
  var canvas = document.getElementById('pong');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W = canvas.width;
  var H = canvas.height;

  var PADDLE_W = 3;
  var PADDLE_H = 24;
  var PADDLE_MARGIN = 14;
  var BALL_SIZE = 3;

  /* Calm initial velocity — neither axis is zero to avoid flat bounces */
  var bx = W / 2;
  var by = H / 2;
  var vx = 1.05;
  var vy = 0.72;

  var leftY  = H / 2 - PADDLE_H / 2;
  var rightY = H / 2 - PADDLE_H / 2;

  /* Paddle tracking speed — deliberately slower than the ball
     so there is occasional near-miss tension without ever scoring */
  var TRACK_SPEED = 0.82;

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    /* Centre divider */
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(26,42,212,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    /* Paddles */
    ctx.fillStyle = 'rgba(242,240,232,0.55)';
    ctx.fillRect(PADDLE_MARGIN, leftY, PADDLE_W, PADDLE_H);
    ctx.fillRect(W - PADDLE_MARGIN - PADDLE_W, rightY, PADDLE_W, PADDLE_H);

    /* Ball */
    ctx.fillStyle = 'rgba(242,240,232,0.75)';
    ctx.fillRect(bx - BALL_SIZE / 2, by - BALL_SIZE / 2, BALL_SIZE, BALL_SIZE);
  }

  function step() {
    /* Move ball */
    bx += vx;
    by += vy;

    /* Top / bottom wall */
    if (by - BALL_SIZE / 2 <= 0) { by = BALL_SIZE / 2; vy = Math.abs(vy); }
    if (by + BALL_SIZE / 2 >= H) { by = H - BALL_SIZE / 2; vy = -Math.abs(vy); }

    /* Left paddle collision */
    var leftEdge  = PADDLE_MARGIN + PADDLE_W;
    var rightEdge = W - PADDLE_MARGIN - PADDLE_W;

    if (vx < 0 && bx - BALL_SIZE / 2 <= leftEdge && by >= leftY && by <= leftY + PADDLE_H) {
      bx = leftEdge + BALL_SIZE / 2;
      vx = Math.abs(vx);
      /* Slight angle variation off the paddle */
      vy += (by - (leftY + PADDLE_H / 2)) * 0.018;
    }

    /* Right paddle collision */
    if (vx > 0 && bx + BALL_SIZE / 2 >= rightEdge && by >= rightY && by <= rightY + PADDLE_H) {
      bx = rightEdge - BALL_SIZE / 2;
      vx = -Math.abs(vx);
      vy += (by - (rightY + PADDLE_H / 2)) * 0.018;
    }

    /* Keep velocity magnitude stable */
    var speed = Math.sqrt(vx * vx + vy * vy);
    var target = 1.3;
    if (speed > 0) { vx = vx / speed * target; vy = vy / speed * target; }

    /* Clamp vy so ball never becomes purely horizontal */
    if (Math.abs(vy) < 0.25) vy = vy < 0 ? -0.25 : 0.25;

    /* Paddle AI — tracks with intentional lag so near-misses are possible */
    var leftCenter  = leftY + PADDLE_H / 2;
    var rightCenter = rightY + PADDLE_H / 2;
    leftY  += clamp((by - leftCenter)  * TRACK_SPEED, -2.2, 2.2);
    rightY += clamp((by - rightCenter) * TRACK_SPEED, -2.2, 2.2);
    leftY  = clamp(leftY,  0, H - PADDLE_H);
    rightY = clamp(rightY, 0, H - PADDLE_H);

    /* Ball escapes a side (shouldn't happen often, but reset gracefully) */
    if (bx < 0 || bx > W) {
      bx = W / 2;
      by = H / 2;
      vx = (bx < W / 2 ? 1 : -1) * 1.05;
      vy = 0.72;
    }
  }

  if (reduced) {
    /* Static frame — ball parked centre, paddles centred */
    draw();
    return;
  }

  function loop() {
    step();
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
}());
</script>

</body>
